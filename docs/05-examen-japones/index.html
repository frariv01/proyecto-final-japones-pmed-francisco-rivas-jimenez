<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen Interactivo de Japonés</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1.5em; background: #f9f9f9; }
    h1 { color: #2b3863; }
    .question { background: #fff; margin-bottom: 1em; padding: 1em; border-radius: 6px; box-shadow: 0 2px 8px #0001; }
    .feedback { margin-top: 0.5em; color: green; font-weight: bold; }
    .incorrect { color: #c32d2d; }
    button { padding: 0.5em 1.5em; font-size: 1em; margin-top: 1em; }
    .order-list, .order-choice { list-style: none; padding: 0; margin: 0; }
    .order-choice { margin-bottom: 5px; cursor: pointer; background: #e5e9f1; padding: 5px 10px; border-radius: 4px;}
    .dragging { opacity: 0.5; }
    .match-select { margin-bottom: 0.5em; }
  </style>
</head>
<body>
<h1>Examen Interactivo de Japonés</h1>
<p>Responde las siguientes preguntas y haz clic en "Finalizar" para ver tu puntaje.</p>
<div id="exam"></div>
<button onclick="submitExam()">Finalizar</button>
<div id="result"></div>
<script>
const xmlPath = '/proyecto-final-japones-pmed-francisco-rivas-jimenez/05-examen-japones/examen-japones-qti-francisco-rivas-jimenez.xml';
let questions = [];
// Para devolver el array de preguntas parseadas (de cada tipo)
function parseQuestions(xml) {
  const items = Array.from(xml.getElementsByTagName('assessmentItem'));
  const nsResolver = xml.createNSResolver(xml.documentElement);
  return items.map((item, idx) => {
    const title = item.getAttribute('title');
    const identifier = item.getAttribute('identifier') || `q${idx + 1}`;
    const bodyP = item.getElementsByTagName('p')[0]?.textContent || '';
    // Tipo simpleChoice (selección multiple)
    if (item.getElementsByTagName('choiceInteraction')[0]) {
      const choices = Array.from(item.getElementsByTagName('simpleChoice'))
        .map(choice => ({
          id: choice.getAttribute('identifier'),
          label: choice.textContent
        }));
      const correct = item.querySelector('correctResponse > value').textContent;
      return {
        type: 'choice',
        title, body: bodyP, choices, correct, id: identifier
      };
    }
    // Tipo inlineChoice (completar con múltiples opciones)
    if (item.getElementsByTagName('inlineChoiceInteraction')[0]) {
      const inChoices = Array.from(item.getElementsByTagName('inlineChoice'))
        .map(choice => ({
          id: choice.getAttribute('identifier'),
          label: choice.textContent
        }));
      const correct = item.querySelector('correctResponse > value').textContent;
      // Captura el texto de la frase con hueco
      const phraseElem = item.getElementsByTagName('p')[1] || item.getElementsByTagName('p')[0];
      let frase = '', after = '';
      if (phraseElem && phraseElem.textContent) {
        frase = phraseElem.textContent.split('まして')[0];
        after = 'まして。';
      }
      return {
        type: 'inline',
        title, body: bodyP, choices: inChoices, correct, frase, after, id: identifier
      };
    }
    // Tipo matching (emparejar vocabulario)
    if (item.getElementsByTagName('matchInteraction')[0]) {
      const matchSets = item.getElementsByTagName('simpleMatchSet');
      const left = Array.from(matchSets[0].getElementsByTagName('simpleAssociableChoice'))
        .map(c => ({id: c.getAttribute('identifier'), label: c.textContent}));
      const right = Array.from(matchSets[1].getElementsByTagName('simpleAssociableChoice'))
        .map(c => ({id: c.getAttribute('identifier'), label: c.textContent}));
      // Correctas: cada value es "CHOICE MATCH"
      const correctPairs = Array.from(item.getElementsByTagName('correctResponse')[0].getElementsByTagName('value'))
        .map(v => v.textContent.split(' '));
      return {
        type: 'matching',
        title, body: bodyP, left, right, correctPairs, id: identifier
      };
    }
    // Tipo texto libre (respuesta escrita)
    if (item.getElementsByTagName('textEntryInteraction')[0]) {
      const correct = item.querySelector('correctResponse > value').textContent;
      return {
        type: 'text',
        title, body: bodyP, correct, id: identifier
      };
    }
    // Tipo ordenar (orderInteraction)
    if (item.getElementsByTagName('orderInteraction')[0]) {
      const choices = Array.from(item.getElementsByTagName('simpleChoice'))
        .map(choice => ({
          id: choice.getAttribute('identifier'),
          label: choice.textContent
        }));
      const correctOrder = Array.from(item.querySelectorAll('correctResponse > value')).map(v => v.textContent);
      return {
        type: 'order',
        title, body: bodyP, choices, correctOrder, id: identifier
      };
    }
    return null;
  }).filter(Boolean);
}
function renderExam(questions) {
  const examDiv = document.getElementById('exam');
  examDiv.innerHTML = '';
  questions.forEach((q, i) => {
    let html = `<div class="question"><b>Pregunta ${i + 1}:</b> <br><i>${q.title}</i><br>${q.body && `<div>${q.body}</div>`}`;
    if (q.type === 'choice') {
      html += q.choices.map(c =>
        `<label><input type="radio" name="${q.id}" value="${c.id}"> ${c.label}</label><br>`
      ).join('');
    }
    if (q.type === 'inline') {
      html += `<div>${q.frase}<select name="${q.id}">` +
        q.choices.map(c => `<option value="${c.id}">${c.label}</option>`).join('') +
        `</select>${q.after}</div>`;
    }
    if (q.type === 'matching') {
      html += `<div>Empareja:</div>`;
      q.left.forEach((l, idx) => {
        html += `<div class="match-select">
          <b>${l.label}</b> 
          <select name="${q.id}-l${idx}">
            <option value="">Selecciona...</option>
            ${q.right.map(r => `<option value="${r.id}">${r.label}</option>`).join('')}
          </select>
        </div>`;
      });
    }
    if (q.type === 'text') {
      html += `<br><input name="${q.id}" type="text" placeholder="Escribe tu respuesta..." size="20">`;
    }
    if (q.type === 'order') {
      html += `<ul class="order-list" id="order-${q.id}">` +
        q.choices.map((c, idx) =>
          `<li class="order-choice" draggable="true" id="${q.id}-drag-${c.id}">${c.label}</li>`
        ).join('') +
        `</ul>
        <small>(Arrastra para ordenar)</small>`;
    }
    html += `</div>`;
    examDiv.innerHTML += html;
  });
  // Drag & drop para ordenar
  questions.forEach(q => {
    if (q.type === 'order') {
      enableDragDrop(`order-${q.id}`);
    }
  });
}
// Drag and drop para ordenar lista
function enableDragDrop(listId) {
  const list = document.getElementById(listId);
  let dragSrcEl = null;
  Array.from(list.children).forEach(li => {
    li.draggable = true;
    li.addEventListener('dragstart', function(e) {
      dragSrcEl = this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', this.innerHTML);
    });
    li.addEventListener('dragover', function(e) {
      e.preventDefault();
      return false;
    });
    li.addEventListener('drop', function(e) {
      e.stopPropagation();
      if (dragSrcEl !== this) {
        [dragSrcEl.innerHTML, this.innerHTML] = [this.innerHTML, dragSrcEl.innerHTML];
        [dragSrcEl.id, this.id] = [this.id, dragSrcEl.id];
      }
      dragSrcEl.classList.remove('dragging');
      return false;
    });
    li.addEventListener('dragend', function() {
      this.classList.remove('dragging');
    });
  });
}
// Al hacer submit
function submitExam() {
  let score = 0, total = questions.length, resHtml = '';
  questions.forEach((q, i) => {
    let correct = false, userVal = '';
    if (q.type === 'choice') {
      userVal = document.querySelector(`input[name="${q.id}"]:checked`)?.value;
      correct = (userVal === q.correct);
      resHtml += `<div>${i+1}. ${q.title} <br>
      Tu respuesta: <b>${q.choices.find(c=>c.id===userVal)?.label||'-'}</b><br>
      ${correct ? `<span class="feedback">¡Correcto!</span>` :
      `<span class="feedback incorrect">Incorrecto. Correcta: <b>${q.choices.find(c=>c.id===q.correct)?.label}</b></span>`}
      </div>`;
    } else if (q.type === 'inline') {
      userVal = document.querySelector(`select[name="${q.id}"]`).value;
      correct = (userVal === q.correct);
      let label = q.choices.find(c => c.id === userVal)?.label || '-';
      let correctLabel = q.choices.find(c => c.id === q.correct)?.label;
      resHtml += `<div>${i+1}. ${q.title}<br>
      Tu respuesta: <b>${label}</b><br>
      ${correct ? `<span class="feedback">¡Correcto!</span>` :
      `<span class="feedback incorrect">Incorrecto. Correcta: <b>${correctLabel}</b></span>`}
      </div>`;
    } else if (q.type === 'matching') {
      let pairs = [];
      let allCorrect = true;
      for (let idx = 0; idx < q.left.length; idx++) {
        let left = q.left[idx].id;
        let right = document.querySelector(`select[name="${q.id}-l${idx}"]`).value;
        pairs.push([left, right]);
        // Verificar si cada par está en correctPairs
        if (!q.correctPairs.some(([a,b]) => a===left && b===right)) allCorrect = false;
      }
      correct = allCorrect;
      resHtml += `<div>${i+1}. ${q.title}<br>
      ${correct ?
        `<span class="feedback">¡Correcto!</span>` :
        `<span class="feedback incorrect">Incorrecto.<br>Pares correctos:<br>` +
        q.correctPairs.map(([a,b]) => 
          `${q.left.find(l=>l.id===a).label} → ${q.right.find(r=>r.id===b).label}`
        ).join('<br>') + '</span>'
      }
      </div>`;
    } else if (q.type === 'text') {
      userVal = (document.querySelector(`input[name="${q.id}"]`).value || '').trim();
      correct = (userVal === q.correct);
      resHtml += `<div>${i+1}. ${q.title}<br>
      Tu respuesta: <b>${userVal}</b><br>
      ${correct ?
        `<span class="feedback">¡Correcto!</span>` :
        `<span class="feedback incorrect">Incorrecto. Respuesta correcta: <b>${q.correct}</b></span>`
      }</div>`;
    } else if (q.type === 'order') {
      // Leer el orden actual de los li
      const lis = Array.from(document.querySelectorAll(`#order-${q.id} .order-choice`));
      let userOrder = lis.map(li => li.id.replace(`${q.id}-drag-`, ''));
      correct = JSON.stringify(userOrder) === JSON.stringify(q.correctOrder);
      resHtml += `<div>${i+1}. ${q.title}<br>
      Tu orden: <b>${userOrder.map(id => q.choices.find(c=>c.id===id).label).join(', ')}</b><br>
      ${correct ?
        `<span class="feedback">¡Correcto!</span>` :
        `<span class="feedback incorrect">Orden correcto: <b>${q.correctOrder.map(id => q.choices.find(c=>c.id===id).label).join(', ')}</b></span>`
      }
      </div>`;
    }
    if (correct) score++;
  });
  document.getElementById('result').innerHTML = `<h3>Puntaje: ${score} / ${total}</h3>${resHtml}`;
  // Opcional: Desactivar el botón tras envío
  document.querySelector('button').disabled = true;
}
// Cargar y renderizar XML al cargar la página
window.addEventListener('DOMContentLoaded', () => {
  fetch(xmlPath)
    .then(resp => resp.text())
    .then(txt => {
      const parser = new DOMParser();
      const xml = parser.parseFromString(txt, "application/xml");
      questions = parseQuestions(xml);
      renderExam(questions);
    }).catch(e => {
      document.getElementById('exam').innerHTML = "Error al cargar el examen. Asegúrate de que el archivo XML está presente.";
    });
});
</script>
</body>
</html>
