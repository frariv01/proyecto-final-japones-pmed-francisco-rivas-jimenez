<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Libro (EPUB)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #viewer { height: 100vh; width: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
  <div id="viewer"></div>

  <script>
    // Ruta relativa desde este HTML hacia el EPUB
    const book = ePub("sobrevivir-en-tokio.epub");
    const rendition = book.renderTo("viewer", { width: "100%", height: "100%" });
    rendition.display();
  </script>
</body>
</html>
