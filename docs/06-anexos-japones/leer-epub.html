<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Libro (EPUB)</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #viewer {
      height: 100vh;
      width: 100vw;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      padding: 16px;
      background: #111;
      color: #eee;
      box-sizing: border-box;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.4;
    }
    #error a { color: #9ad; }
  </style>
  <!-- epub.js expects JSZip to be available when opening ArrayBuffer/archives -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <pre id="error"></pre>

  <script>
    const viewerId = 'viewer';
    const errorEl = document.getElementById('error');

    function showError(err) {
      const msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
      const epubUrl = new URL('sobrevivir-en-tokio.epub', window.location.href).toString();
      errorEl.style.display = 'block';
      errorEl.textContent =
        'No se pudo abrir el libro.\n\n' +
        msg + '\n\n' +
        'Prueba a abrir el EPUB directamente:\n' + epubUrl + '\n';
    }

    async function main() {
      if (typeof JSZip === 'undefined') {
        throw new Error('JSZip lib not loaded');
      }
      if (typeof ePub !== 'function') {
        throw new Error('No se pudo cargar epub.js (CDN).');
      }

      const epubUrl = new URL('sobrevivir-en-tokio.epub', window.location.href).toString();

      // Cargar como ArrayBuffer para máxima compatibilidad en GitHub Pages
      const resp = await fetch(epubUrl, { cache: 'no-store' });
      if (!resp.ok) {
        throw new Error('No se pudo descargar el EPUB. HTTP ' + resp.status);
      }

      const buf = await resp.arrayBuffer();
      const book = ePub(buf);

      const rendition = book.renderTo(viewerId, {
        width: '100%',
        height: '100%'
      });

      await rendition.display();
    }

    main().catch(showError);
  </script>
</body>
</html>
